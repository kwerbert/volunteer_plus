[alembic]
script_location = alembic
prepend_sys_path = .
# URL переопределяется в alembic/env.py из переменной окружения
sqlalchemy.url = postgresql+asyncpg://volunteer:volunteer_secret_change_me@localhost:5432/volunteer_plus

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S